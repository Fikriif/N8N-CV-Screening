<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Kirim Data ke n8n</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: #fff;
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        width: 320px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.2rem;
      }
      label {
      padding-top: 10px;
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: #fff;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #0056b3;
      }
      .msg {
        margin-top: 10px;
        text-align: center;
        font-size: 0.9rem;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    
<div class="container">
  <h2>Kirim Data ke n8n</h2>

  <form id="webhookForm" enctype="multipart/form-data">
    <label for="nama">Nama Lengkap:</label>
    <input
      type="text"
      id="nama"
      name="nama"
      placeholder="Masukkan nama lengkap"
      required
    />

    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Masukkan alamat email"
      required
    />

    <label for="jenis_kelamin">Jenis Kelamin:</label>
    <select id="jenis_kelamin" name="jenis_kelamin" required>
      <option value="Laki-laki">Laki-laki</option>
      <option value="Perempuan">Perempuan</option>
    </select>

    <label for="posisi">Posisi:</label>
    <select id="posisi" name="posisi" required>
      <option value="Frontend Dev">Frontend Dev</option>
      <option value="Backend Dev">Backend Dev</option>
    </select>

    <label for="cv">Upload CV:</label>
    <input
      type="file"
      id="cv"
      name="cv"
      accept=".pdf,.doc,.docx"
      required
    />

    <button type="submit">Kirim</button>
  </form>

  <div class="msg" id="message"></div>
</div>


    
<script>
  document
    .getElementById("webhookForm")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const form = document.getElementById("webhookForm");
      const messageEl = document.getElementById("message");
      const formData = new FormData(form);

      console.log("Tombol kirim diklik");
      console.log("Nama:", formData.get("nama"));
      console.log("Email:", formData.get("email"));
      console.log("Jenis kelamin:", formData.get("jenis_kelamin"));
      console.log("Posisi:", formData.get("posisi"));
      console.log("File CV:", formData.get("cv"));

      try {
        console.log("Mulai mengirim request...");

        const response = await fetch(
          "",
          {
            method: "POST",
            body: formData
          }
        );

        console.log("Status HTTP:", response.status);
        console.log("Respons:", await response.text());

        if (response.ok) {
          messageEl.textContent = "Data berhasil dikirim!";
          messageEl.className = "msg success";
          form.reset();
        } else {
          messageEl.textContent =
            "Gagal mengirim. Status: " + response.status;
          messageEl.className = "msg error";
        }
      } catch (error) {
        console.error("Fetch gagal:", error);
        messageEl.textContent = "Error: " + error.message;
        messageEl.className = "msg error";
      }
    });
</script>

  </body>
</html>
